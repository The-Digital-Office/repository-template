name: Repository standards

# Checks this repository against the Digital Office baseline using the shared
# workflow in The-Digital-Office/.github. Do not remove: the branch ruleset
# requires these checks to pass.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards:
    uses: The-Digital-Office/.github/.github/workflows/repository-standards.yml@v1
