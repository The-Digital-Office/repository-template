name: Template setup

# In a repository created from this template: runs once, on the first push,
# to fill in placeholders and open a setup issue. Safe to delete afterwards.
#
# In the template repository itself: tests that setup produces a valid result.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  setup:
    name: Set up new repository
    if: >-
      github.repository != 'The-Digital-Office/repository-template' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.run_number == 1))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Check setup is still pending
        id: pending
        run: |
          if [[ -f .github/template/setup.sh ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "Setup has already been completed."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fill in repository details
        if: steps.pending.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER_LOGIN: ${{ github.actor }}
        run: |
          MAINTAINER_NAME=$(gh api "users/$OWNER_LOGIN" --jq '.name // ""' || true)
          export MAINTAINER_NAME
          .github/template/setup.sh

      - name: Commit
        if: steps.pending.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete repository setup from template"
          git push

      - name: Open setup issue
        if: steps.pending.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "Complete repository setup" --body-file "$RUNNER_TEMP/setup-issue.md")
          gh issue create "${args[@]}" --assignee "$GITHUB_ACTOR" || gh issue create "${args[@]}"

      - name: Run standards checks on the set-up repository
        if: steps.pending.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes made with the workflow token do not trigger workflows, so
        # start the standards checks explicitly.
        run: gh workflow run standards.yml --ref "$GITHUB_REF_NAME"

  selftest:
    name: Test template setup
    if: github.repository == 'The-Digital-Office/repository-template'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run setup on a copy
        run: |
          work=_selftest
          mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          cd "$work"
          REPO="The-Digital-Office/example-service" \
          OWNER_LOGIN="example-maintainer" \
          MAINTAINER_NAME="Example Maintainer" \
          .github/template/setup.sh

      - name: Validate rendered publiccode.yml
        uses: italia/publiccode-parser-action@0deab88c3f094aa12c5826e52ac2c4f176446821 # v1.6.0
        with:
          publiccode: _selftest/publiccode.yml
          # The example repository does not exist, so skip URL checks.
          no-network: true
